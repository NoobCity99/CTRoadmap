<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 1600 1024">
  <!-- Original CTRoadmap foreground haze; transparent edges allow vertical tiling. -->
  <defs>
    <radialGradient id="haze"><stop stop-color="#a9c0d7" stop-opacity=".68"/><stop offset=".45" stop-color="#789eb5" stop-opacity=".28"/><stop offset="1" stop-color="#668aab" stop-opacity="0"/></radialGradient>
    <radialGradient id="edge"><stop offset=".3" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
    <mask id="fade"><rect width="1600" height="1024" fill="url(#edge)"/></mask>
    <filter id="cloud" x="-15%" y="-20%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .014" numOctaves="3" seed="41" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="115" xChannelSelector="R" yChannelSelector="B"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <g mask="url(#fade)"><g filter="url(#cloud)">
    <ellipse cx="530" cy="570" rx="510" ry="165" fill="url(#haze)" transform="rotate(-28 530 570)"/>
    <ellipse cx="1070" cy="365" rx="510" ry="140" fill="url(#haze)" transform="rotate(-26 1070 365)"/>
  </g></g>
</svg>
