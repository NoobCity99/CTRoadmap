<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 1600 1024">
  <!-- Original CTRoadmap artwork. ART TUNING: gradient hues, path shapes,
       turbulence seed and displacement control the nebula's local appearance. -->
  <defs>
    <radialGradient id="blue"><stop stop-color="#398daa" stop-opacity=".65"/><stop offset=".45" stop-color="#234f91" stop-opacity=".5"/><stop offset="1" stop-color="#234f91" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#aa5ab6" stop-opacity=".58"/><stop offset=".55" stop-color="#683988" stop-opacity=".4"/><stop offset="1" stop-color="#482759" stop-opacity="0"/></radialGradient>
    <radialGradient id="edge"><stop offset=".35" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
    <mask id="fade"><rect width="1600" height="1024" fill="url(#edge)"/></mask>
    <filter id="wisps" x="-15%" y="-20%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".005 .009" numOctaves="3" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="160" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g mask="url(#fade)">
    <g filter="url(#wisps)">
      <ellipse cx="650" cy="430" rx="620" ry="240" fill="url(#blue)" transform="rotate(-24 650 430)"/>
      <ellipse cx="970" cy="565" rx="540" ry="190" fill="url(#violet)" transform="rotate(-32 970 565)"/>
      <ellipse cx="740" cy="660" rx="430" ry="125" fill="url(#blue)" transform="rotate(-28 740 660)"/>
    </g>
  </g>
</svg>
